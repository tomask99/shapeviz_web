<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
  <title>File library · Shapeviz</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/files/library.css"><link rel="stylesheet" href="/cursor.css"><script type="module" src="/files/library.js"></script>
</head>
<body>
  <a class="skip" href="#library">Skip to files</a>
  <header class="site-header"><a class="wordmark" href="/" aria-label="Shapeviz home">SHAPEVIZ<span>®</span></a><a class="studio-link" href="/#contact">Let’s create together <span aria-hidden="true">↗</span></a></header>
  <main id="library">
    <section class="intro"><h1 id="collection-title">Loading…</h1></section>
    <div class="library-heading"><nav id="breadcrumbs" aria-label="Folder navigation"></nav><button id="copy-page" class="secondary" hidden>Copy collection link <span aria-hidden="true">↗</span></button></div>
    <section id="content" aria-live="polite" aria-busy="true"><p class="loading" role="status">Opening your file library…</p></section>
    <section id="transfer" class="transfer" hidden aria-label="File download"><div class="transfer-heading"><div><p class="eyebrow">YOUR DOWNLOAD</p><p id="transfer-name"></p></div><button id="cancel-download" class="secondary">Cancel download</button></div><progress id="download-progress" max="100" value="0" aria-label="Download progress"></progress><p id="download-status" role="status"></p><p class="transfer-hint">Keep this page open until the download finishes.</p></section>
  </main>
  <footer><a class="wordmark" href="/">SHAPEVIZ<span>®</span></a><span>DESIGNED TO BE DESIRED.</span></footer>
  <div id="notice" role="status" aria-live="polite"></div>
  <dialog id="copy-dialog"><h2>Share this file library</h2><p>Copy this link to send it to a colleague or architect.</p><input id="copy-address" readonly aria-label="Link to copy"><form method="dialog"><button class="primary">Done</button></form></dialog>
</body>
</html>
